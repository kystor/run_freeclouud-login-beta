name: 多账号自动登录续期任务(高阶指纹伪装版)

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取代码仓库
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖包
        run: |
          (
            set -e
            pip install seleniumbase ddddocr PyAutoGUI
          ) > pip_install.log 2>&1 || {
            echo "❌ 依赖安装失败，详细日志如下："
            cat pip_install.log
            exit 1
          }

      - name: 🚀 智能解析全协议节点并启动代理内核
        env:
          PROXY: ${{ secrets.PROXY }}
          PY_SCRIPT: |
            import os, sys, json, base64
            from urllib.parse import urlparse, parse_qs

            link = os.environ.get('PROXY', '').strip()
            if not link:
                print("❌ 错误：环境变量 PROXY 为空！")
                sys.exit(1)

            config = {
                "log": {"loglevel": "warning"},
                "inbounds": [{
                    "port": 10808,
                    "listen": "127.0.0.1",
                    "protocol": "socks",
                    "settings": {"udp": True}
                }],
                "outbounds": []
            }

            outbound = {"protocol": "", "settings": {}, "streamSettings": {}}

            def decode_b64(s):
                s = s.replace('-', '+').replace('_', '/')
                s += "=" * ((4 - len(s) % 4) % 4)
                return base64.b64decode(s).decode('utf-8')

            try:
                if link.startswith("vmess://"):
                    outbound["protocol"] = "vmess"
                    v_json = json.loads(decode_b64(link[8:]))
                    outbound["settings"] = {"vnext": [{"address": v_json.get("add", ""), "port": int(v_json.get("port", 443)), "users": [{"id": v_json.get("id", ""), "alterId": int(v_json.get("aid", 0)), "security": v_json.get("scy", "auto")}]}]}
                    net = v_json.get("net", "tcp")
                    outbound["streamSettings"]["network"] = net
                    if net == "ws":
                        outbound["streamSettings"]["wsSettings"] = {"path": v_json.get("path", "/"), "headers": {"Host": v_json.get("host", "")} if v_json.get("host") else {}}
                    if v_json.get("tls") == "tls":
                        outbound["streamSettings"]["security"] = "tls"
                        outbound["streamSettings"]["tlsSettings"] = {"serverName": v_json.get("sni", "") or v_json.get("add", "")}
                        
                elif link.startswith("vless://") or link.startswith("trojan://"):
                    parsed = urlparse(link)
                    proto = parsed.scheme
                    outbound["protocol"] = proto
                    uuid_or_pass = parsed.username or ""
                    host = parsed.hostname or ""
                    port = parsed.port or 443
                    qs = parse_qs(parsed.query) 
                    
                    if proto == "vless":
                        outbound["settings"] = {"vnext": [{"address": host, "port": port, "users": [{"id": uuid_or_pass, "encryption": qs.get("encryption", ["none"])[0]}]}]}
                    else:
                        outbound["settings"] = {"servers": [{"address": host, "port": port, "password": uuid_or_pass}]}
                        
                    net = qs.get("type", ["tcp"])[0]
                    outbound["streamSettings"]["network"] = net
                    if net == "ws":
                        outbound["streamSettings"]["wsSettings"] = {"path": qs.get("path", ["/"])[0], "headers": {"Host": qs.get("host", [""])[0]} if qs.get("host") else {}}
                        
                    security = qs.get("security", ["none"])[0]
                    if security in ["tls", "reality"]:
                        outbound["streamSettings"]["security"] = security
                        outbound["streamSettings"][f"{security}Settings"] = {"serverName": qs.get("sni", [""])[0] or host}
                        if security == "reality":
                            outbound["streamSettings"]["realitySettings"] = {"publicKey": qs.get("pbk", [""])[0], "shortId": qs.get("sid", [""])[0], "fingerprint": qs.get("fp", ["chrome"])[0]}

                elif link.startswith("socks5://") or link.startswith("socks://"):
                    outbound["protocol"] = "socks"
                    parsed = urlparse(link)
                    server = {"address": parsed.hostname, "port": parsed.port or 1080}
                    if parsed.username:
                        server["users"] = [{"user": parsed.username, "pass": parsed.password or ""}]
                    outbound["settings"] = {"servers": [server]}

                else:
                    print(f"❌ 暂不支持自动解析此协议: {link[:10]}...")
                    sys.exit(1)

                config["outbounds"].append(outbound)
                with open("config.json", "w", encoding="utf-8") as f:
                    json.dump(config, f, indent=2)
                
            except Exception as e:
                print(f"❌ 解析链接时发生致命错误: {e}")
                sys.exit(1)
        run: |
          if [ -z "$PROXY" ]; then
              echo "❌ 错误：环境变量 PROXY 为空！"
              exit 1
          fi

          # =====================================================================
          # 🌟 【新增爆改点 1】自适应智能解密：自动识别并解码 Base64 加密的密文
          # =====================================================================
          if [[ "$PROXY" != *"://"* ]]; then
              echo "🔄 检测到 PROXY 密文不含协议头，正在尝试进行 Base64 解码..."
              # 自动计算并补齐 Base64 缺失的 '=' 尾巴，防止报错
              PAD_PROXY=$PROXY
              while [ $(( ${#PAD_PROXY} % 4 )) -ne 0 ]; do
                  PAD_PROXY="${PAD_PROXY}="
              done
              # 执行解码操作
              DECODED=$(echo -n "$PAD_PROXY" | base64 -d 2>/dev/null || true)
              if [[ "$DECODED" == *"://"* ]]; then
                  PROXY="$DECODED"
                  echo "✅ Base64 解码成功！"
              else
                  echo "⚠️ Base64 解码未识别到有效协议，将维持原样字符串。"
              fi
          fi

          # =====================================================================
          # 🌟 【新增爆改点 2】节点清洗：剪掉尾部的 # 别名后缀，防止干扰核心网络请求
          # =====================================================================
          PROXY=$(echo "$PROXY" | cut -d'#' -f1)

          # ==========================================
          # 分支 1：处理 Hysteria2 协议 (hy2:// 或 hysteria2://)
          # ==========================================
          if [[ "$PROXY" == hysteria2://* ]] || [[ "$PROXY" == hy2://* ]]; then
              (
                set -e
                wget https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64 -O hysteria
                chmod +x hysteria
              ) > hysteria_setup.log 2>&1 || {
                echo "❌ Hysteria 下载失败，详细日志如下："
                cat hysteria_setup.log
                exit 1
              }
              
              AUTH=$(echo "$PROXY" | sed -n 's|.*://\([^@]*\)@.*|\1|p' || true)
              SERVER=$(echo "$PROXY" | sed -n 's|.*@\([^/?#]*\).*|\1|p' || true)
              SNI=$(echo "$PROXY" | grep -oP 'sni=\K[^&#]*' || true)
              
              echo "server: $SERVER" > config.yaml
              echo "auth: $AUTH" >> config.yaml
              echo "tls:" >> config.yaml
              echo "  sni: $SNI" >> config.yaml
              echo "  insecure: true" >> config.yaml
              echo "socks5:" >> config.yaml
              echo "  listen: 127.0.0.1:10808" >> config.yaml
              
              echo "FINAL_PROXY=socks5://127.0.0.1:10808" >> $GITHUB_ENV
              echo "✅ 成功配置 Hysteria2 本地内核！"
              nohup ./hysteria client -c config.yaml > proxy.log 2>&1 &
              sleep 5
              
          # ==========================================
          # 🌟 【新增爆改点 3】分支 2：处理原生 SOCKS5 / SOCKS 协议直连（规范化升级）
          # ==========================================
          elif [[ "$PROXY" == socks5://* ]] || [[ "$PROXY" == socks://* ]]; then
              echo "⚡ [智能识别] 检测到您使用的是原生 SOCKS 代理直连链路！"
              
              # 核心清洗：利用 sed 强制把 socks:// 自动标准化升级写为 socks5://
              FINAL_SOCKS_PROXY=$(echo "$PROXY" | sed 's|^socks://|socks5://|')
              
              # 将处理完毕的纯净规范链接存入全局环境变量
              echo "FINAL_PROXY=$FINAL_SOCKS_PROXY" >> $GITHUB_ENV
              echo "✅ 原生 SOCKS5 链路清洗并格式化完成！"

          # ==========================================
          # 分支 3：处理原版的 Xray 逻辑 (VMess/VLESS/Trojan)
          # ==========================================
          else
              (
                set -e
                wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
                unzip Xray-linux-64.zip -x README.md
                chmod +x xray
              ) > xray_setup.log 2>&1 || {
                echo "❌ Xray 下载或解压失败，详细日志如下："
                cat xray_setup.log
                exit 1
              }
              
              printf "%s\n" "$PY_SCRIPT" > parse_proxy.py
              python -u parse_proxy.py
              
              echo "FINAL_PROXY=socks5://127.0.0.1:10808" >> $GITHUB_ENV
              nohup ./xray run -c config.json > proxy.log 2>&1 &
              sleep 5
          fi

      - name: 运行自动化脚本 (指纹环境深度整合版)
        env:
          acount: ${{ secrets.ACOUNT }}
          HTTP_PROXY: ${{ env.FINAL_PROXY }}
          HTTPS_PROXY: ${{ env.FINAL_PROXY }}
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          (
            set -e
            curl -sS -x "$HTTP_PROXY" -I https://www.baidu.com --connect-timeout 10
          ) > curl_test.log 2>&1 || { 
            echo "❌ 代理连接失败！为您提取底层日志："; 
            echo "================ 代理核心运行日志 ================";
            if [ -f proxy.log ]; then
              cat proxy.log
            else
              echo "当前处于 [原生 SOCKS5 直连模式]，未启动任何本地内核。"
              echo "请检查你在 GitHub Secrets 中配置的 PROXY 密文是否正确、Base64 编码前的数据是否失效。"
              echo "当前尝试直连的清洗后节点为: $HTTP_PROXY"
            fi
            echo "====================================================";
            exit 1; 
          }
          
          (
            set -e
            sudo apt-get update
            echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
            sudo apt-get install -y xvfb fonts-noto-cjk ttf-mscorefonts-installer libxss1 libappindicator1 libgconf-2-4 libxi6 libgstreamer1.0-0
          ) > apt_install.log 2>&1 || {
            echo "❌ 虚拟物理指纹库与字体安装失败，详细日志如下："
            cat apt_install.log
            exit 1
          }
          
          xvfb-run --server-args="-screen 0 1920x1080x24" python -u auto_login.py

      - name: 上传运行过程截图与日志文件
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auto-Login-Results
          path: |
            screenshots/
            *.log
          retention-days: 7
